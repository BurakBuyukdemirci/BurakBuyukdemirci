<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="Burak Buyukdemirci — Software and AI Engineer">
  <title>Burak Büyükdemirci — Software &amp; AI Engineer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080D18"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="60" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.35" stop-color="#67E8F9"/>
      <stop offset="0.65" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#E2E8F0"/>
      <animate attributeName="x1" values="-500;60;-500" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="260;760;260" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
      <animate attributeName="x1" values="-600;600;-600" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1800;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#7DD3FC" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="8" y="8" width="1184" height="324" rx="20"/>
    </clipPath>

    <mask id="typeMask">
      <rect x="60" y="232" width="0" height="30" fill="#fff">
        <animate attributeName="width" values="0;0;700;700;0" keyTimes="0;0.05;0.55;0.95;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </mask>

    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SF Mono', ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter','Segoe UI','Helvetica Neue', Helvetica, Arial, sans-serif; }
      .float-a { animation: fa 14s ease-in-out infinite; }
      .float-b { animation: fb 18s ease-in-out infinite; }
      @keyframes fa { 0%,100% { transform: translate(0,0); } 50% { transform: translate(26px,-18px); } }
      @keyframes fb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,16px); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect x="8" y="8" width="1184" height="324" rx="20" fill="url(#bg)"/>
    <rect x="8" y="8" width="1184" height="324" rx="20" fill="url(#grid)"/>

    <g class="float-a"><ellipse cx="150" cy="70" rx="300" ry="200" fill="url(#orbA)"/></g>
    <g class="float-b"><ellipse cx="1020" cy="300" rx="320" ry="220" fill="url(#orbB)"/></g>
    <g class="float-a"><ellipse cx="700" cy="20" rx="280" ry="150" fill="url(#orbC)"/></g>

    <!-- terminal chrome -->
    <rect x="8" y="8" width="1184" height="46" fill="#0B1220" fill-opacity="0.72"/>
    <line x1="8" y1="54" x2="1192" y2="54" stroke="#1E293B" stroke-width="1"/>
    <circle cx="42" cy="31" r="6" fill="#FF5F57"/>
    <circle cx="64" cy="31" r="6" fill="#FEBC2E"/>
    <circle cx="86" cy="31" r="6" fill="#28C840"/>
    <text class="mono" x="600" y="36" text-anchor="middle" font-size="14" fill="#64748B">burak@likya  ~/profile — zsh</text>

    <!-- right-side decoration -->
    <g opacity="0.9" transform="translate(1020,196)">
      <circle r="86" fill="none" stroke="#1E3A5F" stroke-width="1"/>
      <circle r="62" fill="none" stroke="#164E63" stroke-width="1"/>
      <g>
        <circle r="86" fill="none" stroke="#22D3EE" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="34 500" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle r="62" fill="none" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="24 400" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
      </g>
      <circle r="30" fill="#0EA5E9" fill-opacity="0.10" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text class="mono" y="7" text-anchor="middle" font-size="22" fill="#7DD3FC">&lt;/&gt;</text>
    </g>

    <!-- prompt 1 -->
    <text class="mono" x="60" y="104" font-size="15" fill="#475569">
      <tspan fill="#22D3EE">➜</tspan><tspan dx="10" fill="#64748B">~</tspan><tspan dx="10" fill="#94A3B8">whoami</tspan>
    </text>

    <!-- name -->
    <text class="sans" x="58" y="172" font-size="50" font-weight="700" letter-spacing="-1" fill="url(#nameGrad)">Burak Büyükdemirci</text>

    <!-- prompt 2 -->
    <text class="mono" x="60" y="208" font-size="15" fill="#475569">
      <tspan fill="#22D3EE">➜</tspan><tspan dx="10" fill="#64748B">~</tspan><tspan dx="10" fill="#94A3B8">cat role.txt</tspan>
    </text>

    <!-- typed role -->
    <g mask="url(#typeMask)">
      <text class="mono" x="60" y="255" font-size="20" fill="#E2E8F0">Software &amp; AI Engineer · Full-Stack · Mobile · SaaS</text>
    </g>
    <rect x="60" y="236" width="10" height="24" fill="#22D3EE">
      <animate attributeName="x" values="60;60;676;676;60" keyTimes="0;0.05;0.55;0.95;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- chips -->
    <g class="mono" font-size="12.5">
      <g>
        <rect x="60" y="284" width="96" height="26" rx="13" fill="#0EA5E9" fill-opacity="0.10" stroke="#0EA5E9" stroke-opacity="0.35"/>
        <text x="108" y="301" text-anchor="middle" fill="#7DD3FC">React · Next</text>
      </g>
      <g>
        <rect x="166" y="284" width="76" height="26" rx="13" fill="#7C3AED" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/>
        <text x="204" y="301" text-anchor="middle" fill="#C4B5FD">Unity</text>
      </g>
      <g>
        <rect x="252" y="284" width="70" height="26" rx="13" fill="#22C55E" fill-opacity="0.10" stroke="#22C55E" stroke-opacity="0.32"/>
        <text x="287" y="301" text-anchor="middle" fill="#86EFAC">C# · C++</text>
      </g>
      <g>
        <rect x="332" y="284" width="118" height="26" rx="13" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.32"/>
        <text x="391" y="301" text-anchor="middle" fill="#F9A8D4">AI Integrations</text>
      </g>
      <g>
        <rect x="460" y="284" width="140" height="26" rx="13" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-opacity="0.30"/>
        <text x="530" y="301" text-anchor="middle" fill="#FCD34D">SaaS Architecture</text>
      </g>
      <g>
        <rect x="610" y="284" width="118" height="26" rx="13" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.28"/>
        <text x="669" y="301" text-anchor="middle" fill="#BAE6FD">5 Apps Shipped</text>
      </g>
    </g>

    <rect x="8" y="330" width="1184" height="2" fill="url(#rule)"/>
  </g>

  <rect x="8.5" y="8.5" width="1183" height="323" rx="19.5" fill="none" stroke="url(#stroke)" stroke-width="1"/>
</svg>
